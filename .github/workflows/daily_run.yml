name: Spy - Daily Run

on:
  schedule:
    # 21:30 UTC = 18:30 hora Argentina (Mercado ya cerrado y procesado)
    - cron: '30 21 * * 1-5'
  
  # Trigger manual para ejecutarlo con un botón desde la web
  workflow_dispatch: 

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Clonar el repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          cd backend
          pip install -r requirements.txt

      - name: ⚙️ Ejecutar el motor de Spy
        run: |
          cd backend
          python data_loader.py

      - name: 💾 Commit y Push del JSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Añadir el archivo modificado desde la raíz
          git add data/history.json
          
          # Commit tolerante a fallos (si corres el bot y los datos son iguales, no rompe el pipeline)
          git commit -m "🤖 Auto-update: Top 5 candidatas del día" || exit 0
          
          # Empujar cambios a la rama principal
          git push origin main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend # (Cambia esto si tu package.json no está en una carpeta llamada 'frontend')
        run: npm install

      - name: Deploy Frontend to gh-pages
        working-directory: ./frontend # (Ajustar ruta igual que arriba)
        run: npm run deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}